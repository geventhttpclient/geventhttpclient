[build-system]
requires = ["setuptools>=77", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "geventhttpclient"
dynamic = ["version"]
description = "HTTP client library for gevent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE-MIT", "llhttp/LICENSE"]
keywords = ["http", "gevent", "client"]
authors = [{name = "Antonin Amand", email = "antonin.amand@gmail.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]
dependencies = [
    # Single floor for all supported interpreters, verified against the
    # full test suite on Python 3.11-3.15: gevent 25.9 is the first
    # release shipping wheels for Python 3.14. Older gevent releases are
    # not supported.
    "gevent>=25.9",
    "certifi",
    "brotli",
]
optional-dependencies.benchmarks = [
    "requests",
    "httpx",
    "urllib3",
    "httplib2",
]

[dependency-groups]
# PEP 735 group instead of a `dev` extra: uv resolves the `dev` group on a
# plain `uv sync`, so a fresh clone is ready for `uv run pytest` without
# remembering a flag. Extras are distribution metadata, and nothing outside
# this repository installs `[dev]`.
dev = [
    "mypy",
    "pytest",
    "pytest-rerunfailures",
    "dpkt",
    "requests",
    "httplib2",
]

[project.urls]
homepage = "https://github.com/geventhttpclient/geventhttpclient"
repository = "https://github.com/geventhttpclient/geventhttpclient"
issues = "https://github.com/geventhttpclient/geventhttpclient/issues"

[tool.uv]
# Belt and braces: uv already defaults to the `dev` group, spelling it out
# keeps `uv sync --no-default-groups` from quietly producing a tree without
# the test tools.
default-groups = ["dev"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geventhttpclient = ["py.typed", "*.pyi"]

# The package version is derived from git tags (bare format, e.g. "2.5.2",
# no "v" prefix). The generated version file is created at build time and
# must not be committed; the fallback applies to builds without git
# metadata such as shallow CI checkouts or downloaded source trees.
[tool.setuptools_scm]
version_file = "src/geventhttpclient/_version.py"
fallback_version = "0.0.0"

[tool.cibuildwheel]
# CPython 3.11-3.15, no free-threaded variants (cp3xxt); musllinux is
# included via the cp3xx-* globs.
build = ["cp311-*", "cp312-*", "cp313-*", "cp314-*", "cp315-*"]
# Smoke test each built wheel: install it and import the package and the
# C extension before upload. TOML line continuations keep the line length
# in check; the resulting command is a single line.
# Double quotes, not single: cibuildwheel runs this through a shell, and
# cmd.exe (Windows) does not treat single quotes as quoting, so the -c
# argument would be split at spaces and python would see `'import`.
# /bin/sh (Linux, macOS) handles the double quotes just as well.
test-command = """\
python -c "import geventhttpclient, \
geventhttpclient._parser; \
print(geventhttpclient.__version__)"\
"""

[tool.cibuildwheel.linux]
archs = ["x86_64", "aarch64", "ppc64le"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "universal2", "arm64"]

[tool.pytest.ini_options]
markers = [
    "network: tests which require internet access"
]

[tool.ruff]
fix = false
line-length = 100
target-version = "py311"
lint.extend-select = ["UP", "I", "W"]
lint.ignore = ["F821", "E402"]
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true

[tool.ruff.lint.isort]
known-first-party = ["geventhttpclient", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B017", "RUF059", "S110", "BLE001", "DTZ005"]

[tool.codespell]
ignore-regex = ".*codespell-ignore$"

[tool.rumdl]
line-length = 100
exclude = ["llhttp/**", "**/llhttp/**"]

[tool.rumdl.MD013]
reflow = true
