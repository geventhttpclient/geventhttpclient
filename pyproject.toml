[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "geventhttpclient"
version = "2.5.0" # don't forget to update version __init__.py as well
description = "HTTP client library for gevent"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
keywords = ["http", "gevent", "client"]
authors = [{name = "Antonin Amand", email = "antonin.amand@gmail.com"}]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "gevent",
    "certifi",
    "brotli",
]
optional-dependencies.dev = [
    "mypy",
    "pytest",
    "dpkt",
    "requests",
]
optional-dependencies.benchmarks = [
    "requests",
    "httpx",
    "urllib3",
    "httplib2",
]
optional-dependencies.examples = [
    "oauth2",
]


[project.urls]
homepage = "http://github.com/geventhttpclient/geventhttpclient"
issues = "http://github.com/geventhttpclient/geventhttpclient/issues"
download = "https://pypi.org/project/geventhttpclient/#files"


[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["README.md", "release.md", "LICENSE-MIT"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__", "*.pyc", "*.pyo"]


[tool.pytest.ini_options]
markers = [
    "network: tests which require internet access"
]


[tool.ruff]
fix = false
line-length = 100
target-version = "py311"
lint.extend-select = ["UP", "I", "W"]
lint.ignore = ["F821", "E402"]
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
disallow_untyped_defs = true

# Modules not fully typed yet. Remove the override as soon as the module
# is annotated.
[[tool.mypy.overrides]]
module = [
    "geventhttpclient.api",
    "geventhttpclient.httplib",
    "geventhttpclient.httplib2",
    "geventhttpclient.requests",
    "geventhttpclient.useragent",
]
ignore_errors = true

[tool.ruff.lint.isort]
known-first-party = ["geventhttpclient", "tests"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["B017", "RUF059", "S110", "BLE001", "DTZ005"]

[tool.codespell]
ignore-regex = ".*codespell-ignore$"
