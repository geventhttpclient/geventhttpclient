name: Publish

on:
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  build-wheels:
    name: Build wheels (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One job per architecture. The aarch64 wheels build natively on the
      # arm64 runner instead of QEMU, which was what dominated the single
      # ubuntu job; ppc64le keeps QEMU because GitHub hosts no ppc64le runner
      # (those are IBM-provided via their own app and an approved repo list).
      # `archs` is only set where it must override pyproject.toml.
      matrix:
        include:
          - {label: linux-x86_64, os: ubuntu-24.04, archs: x86_64}
          - {label: linux-aarch64, os: ubuntu-24.04-arm, archs: aarch64}
          - {label: linux-ppc64le, os: ubuntu-24.04, archs: ppc64le, qemu: true}
          - {label: macos, os: macos-latest}
          - {label: windows-x86, os: windows-latest}
          - {label: windows-arm64, os: windows-11-arm}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: docker/setup-qemu-action@v3
        if: ${{ matrix.qemu }}
        name: Set up QEMU
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - run: |
          args=(--output-dir wheelhouse)
          if [ -n "${{ matrix.archs }}" ]; then
            args+=(--archs "${{ matrix.archs }}")
          fi
          uvx cibuildwheel==4.2.1 "${args[@]}"
        shell: bash
        name: Run build wheel
      - uses: actions/upload-artifact@v4
        with:
          name: dist-wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
      - run: uv build --sdist
        name: Build source tarball
      - name: Refuse to publish unless the sdist version matches the ref name
        run: |
          test "$(ls dist/*.tar.gz | wc -l)" = 1
          test "geventhttpclient-${GITHUB_REF_NAME}.tar.gz" = "$(basename dist/*.tar.gz)"
      - uses: actions/upload-artifact@v4
        with:
          name: dist-source
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: github.repository == 'geventhttpclient/geventhttpclient'
    runs-on: ubuntu-latest
    needs: [build-wheels, build-sdist]
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        name: Publish package to PyPI
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          skip-existing: true
